name: Update Shadowrocket
on:
  push:
    branches: [main]
    paths: ['clash-*.yaml', 'generate_shadowrocket.py', '.github/workflows/rules.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generate-shadowrocket
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 -m venv /tmp/rule-env
          /tmp/rule-env/bin/pip install PyYAML==6.0.2
          /tmp/rule-env/bin/python generate_shadowrocket.py
          if ! git diff --quiet -- shadowrocket.conf; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add shadowrocket.conf
            git commit -m 'Update generated Shadowrocket rules'
            git push origin HEAD:main
          fi
